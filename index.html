<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 속 제품 모음</title>
<meta name="description" content="쇼츠 영상에 나온 제품 링크 모음">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --sub: #6b6b70;
    --line: #e6e4df; --accent: #e8442e; --accent-text: #ffffff; --chip: #f0eeea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --card: #1f1f22; --text: #f2f2f3; --sub: #a0a0a6;
      --line: #2e2e33; --accent: #ff5a42; --accent-text: #ffffff; --chip: #2a2a2e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .lead { margin: 0 0 18px; color: var(--sub); font-size: 14px; }
  .search { width: 100%; padding: 13px 14px; font-size: 16px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); outline: none; }
  .search:focus { border-color: var(--accent); }
  .list { display: grid; gap: 14px; margin-top: 16px; }
  .item { display: block; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; overflow: hidden; text-decoration: none; color: inherit; }
  .item:active { transform: scale(0.99); }
  .thumb { display: block; width: 100%; aspect-ratio: 540 / 310; object-fit: cover; background: var(--chip); }
  .body { padding: 14px 16px 16px; }
  .meta { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .no { font-size: 12px; font-weight: 700; color: var(--accent); }
  .kw { font-size: 12px; color: var(--sub); background: var(--chip); padding: 2px 8px; border-radius: 99px; }
  .title { font-size: 16px; font-weight: 700; margin: 0 0 12px; letter-spacing: -0.01em; }
  .btn { display: block; text-align: center; background: var(--accent); color: var(--accent-text);
    font-weight: 700; font-size: 15px; padding: 12px; border-radius: 10px; }
  .empty { display: none; text-align: center; color: var(--sub); padding: 32px 0; font-size: 14px; }
  .notice { margin-top: 28px; font-size: 12px; color: var(--sub); text-align: center; }
</style>
</head>
<body>
<main class="wrap">
  <h1>영상 속 제품 모음</h1>
  <p class="lead">영상 번호나 댓글 키워드로 찾아보세요.</p>
  <input class="search" id="q" type="search" placeholder="예: 1편, 오픈형, 이어폰" aria-label="제품 검색">
  <div class="list" id="list"></div>
  <p class="empty" id="empty">찾는 제품이 없어요. 다른 단어로 검색해 보세요.</p>
  <p class="notice">이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
</main>

<script>
  // ▼ 영상이 올라갈 때마다 여기에 한 줄씩 추가 (최신 편이 맨 위에 보임)
  const ITEMS = [
    { no: 1, title: "귀 아파서 이어폰 빼던 사람, 결국 찾아낸 이것", keyword: "오픈형", tags: "이어폰 오픈형이어폰 러닝", img: "01.jpg", url: "https://link.coupang.com/a/iA0beSNIUm" },
    { no: 2, title: "대기업도 안 가져간 스펀지, 6분 만에 매진된 이유", keyword: "수세미", tags: "수세미 스펀지 설거지 주방", img: "02.jpg", url: "https://link.coupang.com/a/iAXDf0i9uu" },
    { no: 3, title: "은퇴한 남편이 다시 만든, 미술관까지 간 이것", keyword: "감자칼", tags: "감자칼 필러 주방 손잡이", img: "03.jpg", url: "https://link.coupang.com/a/iAXHMoJZZs" },
    { no: 4, title: "차가 불탔는데 얼음은 그대로, 결국 새 차 받은 컵", keyword: "텀블러", tags: "텀블러 손잡이텀블러 차량용 얼음", img: "04.jpg", url: "https://link.coupang.com/a/iAXEyiIvMi" },
    { no: 5, title: "아내 위해 만든 청소기, 150년째 팔리는 중", keyword: "청소기", tags: "청소기 카펫청소 얼룩제거 습식청소기", img: "05.jpg", url: "https://link.coupang.com/a/iAXEEfOiVU" },
    { no: 6, title: "투자자 넷이 다 거절한 빗, 결국 대박 난 이유", keyword: "빗", tags: "빗 헤어브러쉬 엉킴방지빗 머리빗", img: "06.jpg", url: "https://link.coupang.com/a/iAXEKvqhNI" },
    { no: 7, title: "목공 공구로 오렌지 갈다가, 주방까지 뒤집은 이것", keyword: "강판", tags: "강판 제스터 치즈강판 레몬제스트", img: "07.jpg", url: "https://link.coupang.com/a/iAXEQSooxM" },
    { no: 8, title: "과학자들이 등산 갈 때 챙긴, 실험실 병의 정체", keyword: "물병", tags: "물병 등산물병 캠핑용품 와이드마우스 눈금물병", img: "08.jpg", url: "https://link.coupang.com/a/iOj5N3IbF6" },
    { no: 9, title: "빨래통에서 시작된, 커피포트의 정체", keyword: "모카포트", tags: "모카포트 홈카페 커피포트 에스프레소 직화커피", img: "09.jpg", url: "https://link.coupang.com/a/iOj7i3i8Bw" },
    { no: 10, title: "반쪽 보트도 붙인다는, 검은색 미국 테이프?", keyword: "테이프", tags: "테이프 방수테이프 누수테이프 보수테이프", img: "10.jpg", url: "https://link.coupang.com/a/iMx8vs260W" },
    { no: 11, title: "흙탕물도 그냥 들이켠다는, 초소형 정수 빨대?", keyword: "정수빨대", tags: "정수빨대 휴대용정수기 캠핑정수기 비상식수 재난대비", img: "11.jpg", url: "https://link.coupang.com/a/iS8O1OB22m" },
    { no: 12, title: "손잡이를 쥐면 접힌다는, 영국 접이식 도마?", keyword: "접이식 도마", tags: "접이식도마 도마추천 주방용품 요리꿀템 찹투팟", img: "12.jpg", url: "https://link.coupang.com/a/iWxglvzb08" },
    { no: 13, title: "머리카락 뭉쳐도 물이 콸콸 빠진다는, 배수구 거름망?", keyword: "배수구 거름망", tags: "배수구거름망 머리카락거름망 욕실거름망 세면대거름망 욕실청소", img: "13.jpg", url: "https://link.coupang.com/a/iX3wxMSwZU" },
    { no: 14, title: "찰흙처럼 주물러 붙이면 고무로 굳는다는, 만능 수선 점토?", keyword: "수선 점토", tags: "수선점토 실리콘점토 충전기수리 케이블수리 성형접착제", img: "14.jpg", url: "https://link.coupang.com/a/iX3AQtrvQy" },
    { no: 15, title: "누르면 완전 밀폐돼 뒤집어도 안 쏟아진다는, 만능 매직랩?", keyword: "매직랩", tags: "매직랩 밀폐랩 음식보관랩 진공밀폐 주방꿀템", img: "15.jpg", url: "https://link.coupang.com/a/iX3CAKZmdU" },
  ];
  // ▲ 여기까지

  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const items = [...ITEMS].sort((a, b) => b.no - a.no);

  function render(q) {
    const s = q.trim().replace(/\s+/g, "").toLowerCase();
    const shown = items.filter(it => !s ||
      (it.no + "편" + it.title + it.keyword + it.tags).replace(/\s+/g, "").toLowerCase().includes(s.replace(/^(\d+)$/, "$1편")));
    list.innerHTML = shown.map(it => `
      <a class="item" href="${esc(it.url)}" target="_blank" rel="noopener sponsored">
        <img class="thumb" src="${esc(it.img)}" alt="" loading="lazy">
        <div class="body">
          <div class="meta"><span class="no">${it.no}편</span><span class="kw">#${esc(it.keyword)}</span></div>
          <p class="title">${esc(it.title)}</p>
          <span class="btn">제품 보러 가기</span>
        </div>
      </a>`).join("");
    empty.style.display = shown.length ? "none" : "block";
  }
  document.getElementById("q").addEventListener("input", e => render(e.target.value));
  render("");
</script>
</body>
</html>
